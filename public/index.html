<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Создание, редактирование и поиск заметок по тегам.">
    <title>Заметки с тегами</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/style.css">
    <script src="/app.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#main">Перейти к содержимому</a>
    <header>
        <div class="container">
            <p class="eyebrow">Камиль Галимзянов · 932404</p>
            <h1>Заметки с тегами</h1>
            <p>Сохраняйте идеи и находите нужное по тегам.</p>
        </div>
    </header>

    <main id="main" class="container" tabindex="-1">
        <section class="panel" aria-labelledby="editor-title">
            <h2 id="editor-title">Новая заметка</h2>
            <form id="note-form">
                <label for="note-title">Название</label>
                <input id="note-title" name="title" type="text" required>

                <label for="note-body">Текст</label>
                <textarea id="note-body" name="body" rows="5"></textarea>

                <label for="note-tags">Теги через запятую</label>
                <input id="note-tags" name="tags" type="text" aria-describedby="tags-hint">
                <p id="tags-hint" class="muted">Например: js, sqlite, учёба.</p>

                <div class="actions">
                    <button id="save-note" type="submit">Добавить заметку</button>
                    <button id="cancel-edit" class="secondary" type="button" hidden>Отменить редактирование</button>
                </div>
            </form>
        </section>

        <p id="message" class="message" role="status" aria-live="polite"></p>

        <section aria-labelledby="notes-title">
            <div class="section-heading">
                <h2 id="notes-title">Мои заметки</h2>
                <p id="notes-count" class="muted" role="status">Загрузка…</p>
            </div>
            <form id="filter-form" class="filter-form" role="search">
                <div class="filter-field">
                    <label for="filter-tag">Поиск по тегу</label>
                    <input id="filter-tag" name="tag" type="text">
                </div>
                <button type="submit">Найти</button>
                <button id="show-all" class="secondary" type="button">Показать все</button>
            </form>
            <p id="empty-list" class="empty-list" hidden>Пока нет заметок.</p>
            <div id="notes-list" class="notes-list"></div>
        </section>
        <noscript><p>Для работы с заметками включите JavaScript.</p></noscript>
    </main>

    <footer>
        <div class="container">
            <a href="https://github.com/DeboshCode/932404.galimzyanov.kamil.lab7">Репозиторий проекта</a>
        </div>
    </footer>
</body>
</html>
